name: CI/CD

on:
  pull_request:
  push:
    branches:
      - dev
      - main

env:
  IMAGE_NAME: holiday-itinerary
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m compileall models src

      - name: Create CI environment file
        run: |
          cat > .env.ci <<'EOF'
          DATATOURISME_TOKEN=dummy-token
          DB_USER=admin
          DB_PASSWORD=root
          DB_NAME=holiday_db
          DB_HOST=postgres
          DB_PORT=5432
          NEO4J_USER=neo4j
          NEO4J_PASSWORD=neo4jpassword
          NEO4J_URI=bolt://neo4j:7687
          NEO4J_HOST=neo4j
          NEO4J_PORT=7687
          EOF

      - name: Validate Docker Compose file
        run: docker compose --env-file .env.ci config

      - name: Build Docker image
        run: docker build -t "${IMAGE_NAME}:ci" .

  publish:
    name: Publish Docker image
    needs: checks
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decide whether Docker Hub publish is enabled
        id: publish
        run: |
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub secrets are not configured; skipping image publish."
          fi

      - name: Set up Docker Buildx
        if: steps.publish.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.publish.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.publish.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
