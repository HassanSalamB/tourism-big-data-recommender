name: CI/CD

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: holiday-itinerary
  AIRFLOW_IMAGE_NAME: holiday-itinerary-airflow

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m compileall src

      - name: Create CI environment file
        run: |
          cat > .env.ci <<'EOF'
          DATATOURISME_TOKEN=dummy-token
          APP_IMAGE=holiday-itinerary:ci
          AIRFLOW_IMAGE=holiday-itinerary-airflow:ci
          DB_USER=admin
          DB_PASSWORD=root
          DB_NAME=holiday_db
          DB_HOST=postgres
          DB_PORT=5432
          NEO4J_USER=neo4j
          NEO4J_PASSWORD=neo4jpassword
          NEO4J_URI=bolt://neo4j:7687
          NEO4J_HOST=neo4j
          NEO4J_PORT=7687
          KAFKA_BOOTSTRAP_SERVERS=kafka:9092
          AIRFLOW_UID=50000
          AIRFLOW_DB_PASSWORD=ci-only-airflow-db-password
          AIRFLOW_ADMIN_USERNAME=ci-admin
          AIRFLOW_ADMIN_PASSWORD=ci-only-airflow-admin-password
          AIRFLOW_ADMIN_EMAIL=ci-admin@example.com
          AIRFLOW_WEBSERVER_SECRET_KEY=ci-only-airflow-webserver-secret-key
          GRAFANA_ADMIN_USER=ci-admin
          GRAFANA_ADMIN_PASSWORD=ci-only-grafana-password
          CLOUDFLARE_TUNNEL_TOKEN=ci-only-token
          SNOWFLAKE_ACCOUNT=dummy-account
          SNOWFLAKE_USER=dummy-user
          SNOWFLAKE_PASSWORD=dummy-password
          SNOWFLAKE_ROLE=TRANSFORMER
          SNOWFLAKE_DATABASE=HOLIDAY_ITINERARY
          SNOWFLAKE_WAREHOUSE=TRANSFORMING_WH
          SNOWFLAKE_SCHEMA=ANALYTICS
          EOF
          cp .env.ci .env

      - name: Validate Docker Compose file
        run: docker compose --env-file .env.ci config

      - name: Validate release Docker Compose file
        run: |
          cp .env.ci distribution/.env
          docker compose --env-file distribution/.env -f distribution/compose.release.yml --profile tunnel config

      - name: Run repository tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build Docker image
        run: docker build -t "${IMAGE_NAME}:ci" .

      - name: Build Airflow Docker image
        run: docker build -f Dockerfile.airflow -t "${AIRFLOW_IMAGE_NAME}:ci" .

  publish:
    name: Publish Docker image
    needs: checks
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image namespace
        id: namespace
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push app Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.namespace.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ghcr.io/${{ steps.namespace.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      - name: Build and push Airflow Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.airflow
          push: true
          tags: |
            ghcr.io/${{ steps.namespace.outputs.owner }}/${{ env.AIRFLOW_IMAGE_NAME }}:${{ github.sha }}
            ghcr.io/${{ steps.namespace.outputs.owner }}/${{ env.AIRFLOW_IMAGE_NAME }}:${{ github.ref_name }}
