name: CI/CD

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: holiday-itinerary
  AIRFLOW_IMAGE_NAME: holiday-itinerary-airflow
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m compileall src hospitality_demo tests

      - name: Test accommodation intelligence demo
        run: python -m unittest discover -s tests -p 'test_hospitality_demo.py' -v

      - name: Create CI environment file
        run: |
          cat > .env.ci <<'EOF'
          DATATOURISME_TOKEN=dummy-token
          APP_IMAGE=holiday-itinerary:ci
          AIRFLOW_IMAGE=holiday-itinerary-airflow:ci
          DB_USER=admin
          DB_PASSWORD=root
          DB_NAME=holiday_db
          DB_HOST=postgres
          DB_PORT=5432
          NEO4J_USER=neo4j
          NEO4J_PASSWORD=neo4jpassword
          NEO4J_URI=bolt://neo4j:7687
          NEO4J_HOST=neo4j
          NEO4J_PORT=7687
          KAFKA_BOOTSTRAP_SERVERS=kafka:9092
          AIRFLOW_UID=50000
          SNOWFLAKE_ACCOUNT=dummy-account
          SNOWFLAKE_USER=dummy-user
          SNOWFLAKE_PASSWORD=dummy-password
          SNOWFLAKE_ROLE=TRANSFORMER
          SNOWFLAKE_DATABASE=HOLIDAY_ITINERARY
          SNOWFLAKE_WAREHOUSE=TRANSFORMING_WH
          SNOWFLAKE_SCHEMA=ANALYTICS
          EOF
          cp .env.ci .env

      - name: Validate Docker Compose file
        run: docker compose --env-file .env.ci config

      - name: Validate release Docker Compose file
        run: |
          cp .env.ci distribution/.env
          docker compose --env-file distribution/.env -f distribution/compose.release.yml config

      - name: Build Docker image
        run: docker build -t "${IMAGE_NAME}:ci" .

      - name: Build Airflow Docker image
        run: docker build -f Dockerfile.airflow -t "${AIRFLOW_IMAGE_NAME}:ci" .

  publish:
    name: Publish Docker image
    needs: checks
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Decide whether Docker Hub publish is enabled
        id: publish
        run: |
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub secrets are not configured; skipping image publish."
          fi

      - name: Set up Docker Buildx
        if: steps.publish.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: steps.publish.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push app Docker image
        if: steps.publish.outputs.enabled == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Build and push Airflow Docker image
        if: steps.publish.outputs.enabled == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.airflow
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.AIRFLOW_IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.AIRFLOW_IMAGE_NAME }}:${{ github.sha }}
