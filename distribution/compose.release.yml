x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *runtime
    image: postgres:15.14-bookworm
    container_name: postgres_db
    mem_limit: 1g
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  neo4j:
    <<: *runtime
    image: neo4j:5.26.12-community
    container_name: neo4j_db
    mem_limit: 2g
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${NEO4J_BROWSER_PORT:-7474}:7474"
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data

  kafka:
    <<: *runtime
    image: bitnamilegacy/kafka:4.0.0-debian-12-r10
    container_name: holiday_kafka
    mem_limit: 1g
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka_data:/bitnami/kafka

  kafka-ui:
    <<: *runtime
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: holiday_kafka_ui
    mem_limit: 512m
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${KAFKA_UI_PORT:-8090}:8080"
    depends_on:
      - kafka
    environment:
      - KAFKA_CLUSTERS_0_NAME=holiday-local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092

  kafka-analytics-consumer:
    <<: *runtime
    image: ${APP_IMAGE}
    container_name: holiday_kafka_analytics_consumer
    mem_limit: 512m
    command: python -m src.streaming.analytics_consumer
    env_file: ${SERVICE_ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app:/app/src
      - DB_HOST=postgres
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_ANALYTICS_GROUP_ID=holiday-analytics-consumer
      - KAFKA_ANALYTICS_OFFSET_RESET=earliest
      - KAFKA_ANALYTICS_METRICS_PORT=9108

  spark-master:
    <<: *runtime
    image: bitnamilegacy/spark:4.0.0-debian-12-r20
    container_name: holiday_spark_master
    mem_limit: 1g
    environment:
      - SPARK_MODE=master
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${SPARK_UI_PORT:-8080}:8080"
    volumes:
      - holiday_data:/opt/holiday/data
      - holiday_data:/app/data

  spark-worker:
    <<: *runtime
    image: bitnamilegacy/spark:4.0.0-debian-12-r20
    container_name: holiday_spark_worker
    mem_limit: 3g
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES:-2}
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY:-2G}
    depends_on:
      - spark-master
    volumes:
      - holiday_data:/opt/holiday/data
      - holiday_data:/app/data

  airflow-postgres:
    <<: *runtime
    image: postgres:15.14-bookworm
    container_name: holiday_airflow_postgres
    mem_limit: 512m
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - airflow_pg_data:/var/lib/postgresql/data

  airflow-init:
    image: ${AIRFLOW_IMAGE}
    container_name: holiday_airflow_init
    env_file: ${SERVICE_ENV_FILE:-.env}
    user: "${AIRFLOW_UID:-50000}:0"
    entrypoint: /bin/bash
    command:
      - -c
      - airflow db migrate && airflow users create --username admin --password admin --firstname Local --lastname Admin --role Admin --email admin@example.com || true
    depends_on:
      airflow-postgres:
        condition: service_healthy
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
      kafka:
        condition: service_started
      spark-master:
        condition: service_started
    volumes:
      - holiday_data:/opt/holiday/data
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      - AIRFLOW__WEBSERVER__SECRET_KEY=local-dev-secret
      - PYTHONPATH=/opt/holiday:/opt/holiday/src
      - NEO4J_URI=bolt://neo4j:7687
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_DRIVER_MEMORY=${SPARK_DRIVER_MEMORY:-1g}
      - SPARK_EXECUTOR_MEMORY=${SPARK_EXECUTOR_MEMORY:-1g}
      - SPARK_EXECUTOR_CORES=${SPARK_EXECUTOR_CORES:-1}
      - SPARK_SQL_SHUFFLE_PARTITIONS=${SPARK_SQL_SHUFFLE_PARTITIONS:-8}

  airflow-webserver:
    <<: *runtime
    image: ${AIRFLOW_IMAGE}
    container_name: holiday_airflow_webserver
    mem_limit: 2g
    command: webserver
    env_file: ${SERVICE_ENV_FILE:-.env}
    user: "${AIRFLOW_UID:-50000}:0"
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${AIRFLOW_PORT:-8088}:8080"
    depends_on:
      airflow-postgres:
        condition: service_healthy
    volumes:
      - holiday_data:/opt/holiday/data
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      - AIRFLOW__WEBSERVER__SECRET_KEY=local-dev-secret
      - PYTHONPATH=/opt/holiday:/opt/holiday/src
      - NEO4J_URI=bolt://neo4j:7687
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_DRIVER_MEMORY=${SPARK_DRIVER_MEMORY:-1g}
      - SPARK_EXECUTOR_MEMORY=${SPARK_EXECUTOR_MEMORY:-1g}
      - SPARK_EXECUTOR_CORES=${SPARK_EXECUTOR_CORES:-1}
      - SPARK_SQL_SHUFFLE_PARTITIONS=${SPARK_SQL_SHUFFLE_PARTITIONS:-8}

  airflow-scheduler:
    <<: *runtime
    image: ${AIRFLOW_IMAGE}
    container_name: holiday_airflow_scheduler
    mem_limit: 2g
    command: scheduler
    env_file: ${SERVICE_ENV_FILE:-.env}
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      airflow-postgres:
        condition: service_healthy
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
      kafka:
        condition: service_started
      spark-master:
        condition: service_started
    volumes:
      - holiday_data:/opt/holiday/data
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      - AIRFLOW__WEBSERVER__SECRET_KEY=local-dev-secret
      - PYTHONPATH=/opt/holiday:/opt/holiday/src
      - NEO4J_URI=bolt://neo4j:7687
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_DRIVER_MEMORY=${SPARK_DRIVER_MEMORY:-1g}
      - SPARK_EXECUTOR_MEMORY=${SPARK_EXECUTOR_MEMORY:-1g}
      - SPARK_EXECUTOR_CORES=${SPARK_EXECUTOR_CORES:-1}
      - SPARK_SQL_SHUFFLE_PARTITIONS=${SPARK_SQL_SHUFFLE_PARTITIONS:-8}

  dbt:
    <<: *runtime
    image: ${AIRFLOW_IMAGE}
    container_name: holiday_dbt
    mem_limit: 1g
    working_dir: /opt/holiday/dbt
    env_file: ${SERVICE_ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - while true; do dbt run --profiles-dir . && dbt test --profiles-dir . || true; sleep 900; done
    environment:
      - DB_HOST=postgres
      - DBT_TARGET=postgres

  api:
    <<: *runtime
    image: ${APP_IMAGE}
    container_name: holiday_api
    mem_limit: 1g
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000
    env_file: ${SERVICE_ENV_FILE:-.env}
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${FASTAPI_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app:/app/src
      - NEO4J_URI=bolt://neo4j:7687
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092

  dashboard:
    <<: *runtime
    image: ${APP_IMAGE}
    container_name: holiday_dashboard
    mem_limit: 1g
    command: streamlit run src/api/dashboard.py --server.address 0.0.0.0 --server.port 8501
    env_file: ${SERVICE_ENV_FILE:-.env}
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${STREAMLIT_PORT:-8501}:8501"
    depends_on:
      - api
    environment:
      - API_BASE_URL=http://api:8000

  prometheus:
    <<: *runtime
    image: prom/prometheus:v3.7.3
    container_name: holiday_prometheus
    mem_limit: 1g
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - api
      - kafka-analytics-consumer
      - alertmanager

  alertmanager:
    <<: *runtime
    image: prom/alertmanager:v0.29.0
    container_name: holiday_alertmanager
    mem_limit: 256m
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${ALERTMANAGER_PORT:-9093}:9093"

  grafana:
    <<: *runtime
    image: grafana/grafana:12.3.0
    container_name: holiday_grafana
    mem_limit: 512m
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - alertmanager

  adminer:
    <<: *runtime
    image: adminer:5.4.1-standalone
    container_name: adminer_ui
    mem_limit: 256m
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${ADMINER_PORT:-5050}:8080"
    depends_on:
      - postgres

  cloudflared:
    <<: *runtime
    image: cloudflare/cloudflared:2026.8.1
    container_name: holiday_cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    mem_limit: 256m
    profiles: ["tunnel"]

volumes:
  pg_data:
  neo4j_data:
  kafka_data:
  airflow_pg_data:
  holiday_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
