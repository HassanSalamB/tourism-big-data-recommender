services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  neo4j:
    image: neo4j:5
    container_name: neo4j_db
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data

  adminer:
    image: adminer
    container_name: adminer_ui
    restart: always
    ports:
      - "5050:8080"
    depends_on:
      - postgres

  etl_worker:
    image: ${APP_IMAGE}
    container_name: etl_worker
    command: sh /app/src/cron/start_with_cron.sh
    env_file: .env
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
    tty: true
    stdin_open: true
    environment:
      - PYTHONUNBUFFERED=1
      - NEO4J_URI=bolt://neo4j:7687

  api:
    image: ${APP_IMAGE}
    container_name: holiday_api
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app:/app/src
      - NEO4J_URI=bolt://neo4j:7687

  dashboard:
    image: ${APP_IMAGE}
    container_name: holiday_dashboard
    command: streamlit run src/api/dashboard.py --server.address 0.0.0.0 --server.port 8501
    env_file: .env
    ports:
      - "8501:8501"
    depends_on:
      - api
    environment:
      - API_BASE_URL=http://api:8000

volumes:
  pg_data:
  neo4j_data:
