global:
  resolve_timeout: 5m

route:
  receiver: local-alertmanager-ui
  group_by:
    - alertname
    - service
  group_wait: 15s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: local-alertmanager-ui

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - service
