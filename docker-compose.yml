x-app-common: &app-common
  image: ${APP_IMAGE:-holiday-itinerary:local}
  build:
    context: .
    dockerfile: Dockerfile

x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE:-holiday-itinerary-airflow:local}
  build:
    context: .
    dockerfile: Dockerfile.airflow
  env_file: .env
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__CORE__LOAD_EXAMPLES=false
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-postgres:5432/airflow
    - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW_WEBSERVER_SECRET_KEY:-local-dev-secret}
    - PYTHONPATH=/opt/holiday:/opt/holiday/src
    - NEO4J_URI=bolt://neo4j:7687
    - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    - SPARK_MASTER_URL=spark://spark-master:7077
    - SPARK_DRIVER_MEMORY=${SPARK_DRIVER_MEMORY:-1g}
    - SPARK_EXECUTOR_MEMORY=${SPARK_EXECUTOR_MEMORY:-1g}
    - SPARK_EXECUTOR_CORES=${SPARK_EXECUTOR_CORES:-1}
    - SPARK_SQL_SHUFFLE_PARTITIONS=${SPARK_SQL_SHUFFLE_PARTITIONS:-8}
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./dbt:/opt/holiday/dbt
    - ./src:/opt/holiday/src
    - ./config.yaml:/opt/holiday/config.yaml
    - ./requirements.txt:/opt/holiday/requirements.txt
    - ./requirements-analytics.txt:/opt/holiday/requirements-analytics.txt
    - ./data:/opt/holiday/data
    - ./.env:/opt/holiday/.env:ro
  depends_on:
    airflow-postgres:
      condition: service_healthy
    postgres:
      condition: service_healthy
    neo4j:
      condition: service_started
    kafka:
      condition: service_started
    spark-master:
      condition: service_started

services:
  postgres:
    image: postgres:15.14-bookworm
    container_name: postgres_db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  adminer:
    image: adminer:5.4.1-standalone
    container_name: adminer_ui
    restart: always
    ports:
      - "5050:8080"
    depends_on:
      - postgres

  neo4j:
    image: neo4j:5.26.12-community
    container_name: neo4j_db
    networks:
      default:
        aliases:
          - neo4j
          - neo4j_db
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data

  kafka:
    image: bitnamilegacy/kafka:4.0.0-debian-12-r10
    container_name: holiday_kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka_data:/bitnami/kafka

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: holiday_kafka_ui
    ports:
      - "8090:8080"
    depends_on:
      - kafka
    environment:
      - KAFKA_CLUSTERS_0_NAME=holiday-local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092

  kafka-analytics-consumer:
    <<: *app-common
    container_name: holiday_kafka_analytics_consumer
    command: python -m src.streaming.analytics_consumer
    env_file: .env
    volumes:
      - ./src:/app/src
      - ./.env:/app/.env:ro
    ports:
      - "9108:9108"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app:/app/src
      - DB_HOST=postgres
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_ANALYTICS_GROUP_ID=holiday-analytics-consumer
      - KAFKA_ANALYTICS_OFFSET_RESET=earliest
      - KAFKA_ANALYTICS_METRICS_PORT=9108

  spark-master:
    image: bitnamilegacy/spark:4.0.0-debian-12-r20
    container_name: holiday_spark_master
    environment:
      - SPARK_MODE=master
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./data:/opt/holiday/data

  spark-worker:
    image: bitnamilegacy/spark:4.0.0-debian-12-r20
    container_name: holiday_spark_worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES:-2}
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY:-2G}
    depends_on:
      - spark-master
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./data:/opt/holiday/data

  airflow-postgres:
    image: postgres:15.14-bookworm
    container_name: holiday_airflow_postgres
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=${AIRFLOW_DB_PASSWORD:-airflow}
      - POSTGRES_DB=airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - airflow_pg_data:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    container_name: holiday_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - airflow db migrate && airflow users create --username ${AIRFLOW_ADMIN_USERNAME:-admin} --password ${AIRFLOW_ADMIN_PASSWORD:-admin} --firstname Local --lastname Admin --role Admin --email ${AIRFLOW_ADMIN_EMAIL:-admin@example.com} || true

  airflow-webserver:
    <<: *airflow-common
    container_name: holiday_airflow_webserver
    command: webserver
    ports:
      - "8088:8080"

  airflow-scheduler:
    <<: *airflow-common
    container_name: holiday_airflow_scheduler
    command: scheduler

  dbt:
    <<: *airflow-common
    container_name: holiday_dbt
    entrypoint: /bin/bash
    working_dir: /opt/holiday/dbt
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-postgres:5432/airflow
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW_WEBSERVER_SECRET_KEY:-local-dev-secret}
      - PYTHONPATH=/opt/holiday:/opt/holiday/src
      - NEO4J_URI=bolt://neo4j:7687
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_DRIVER_MEMORY=${SPARK_DRIVER_MEMORY:-1g}
      - SPARK_EXECUTOR_MEMORY=${SPARK_EXECUTOR_MEMORY:-1g}
      - SPARK_EXECUTOR_CORES=${SPARK_EXECUTOR_CORES:-1}
      - SPARK_SQL_SHUFFLE_PARTITIONS=${SPARK_SQL_SHUFFLE_PARTITIONS:-8}
      - DB_HOST=postgres
      - DBT_TARGET=postgres
    command:
      - -c
      - while true; do dbt run --profiles-dir . && dbt test --profiles-dir . || true; sleep 900; done

  api:
    <<: *app-common
    container_name: holiday_api
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    volumes:
      - ./src:/app/src
      - ./config.yaml:/app/config.yaml
      - ./.env:/app/.env:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app:/app/src
      - NEO4J_URI=bolt://neo4j:7687
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092

  dashboard:
    <<: *app-common
    container_name: holiday_dashboard
    command: streamlit run src/api/dashboard.py --server.address 0.0.0.0 --server.port 8501
    env_file: .env
    volumes:
      - ./src:/app/src
      - ./.streamlit:/app/.streamlit:ro
    ports:
      - "8501:8501"
    depends_on:
      - api
    environment:
      - API_BASE_URL=http://api:8000

  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: holiday_prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api
      - kafka-analytics-consumer
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.29.0
    container_name: holiday_alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:12.3.0
    container_name: holiday_grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - alertmanager

volumes:
  pg_data:
  neo4j_data:
  kafka_data:
  airflow_pg_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
