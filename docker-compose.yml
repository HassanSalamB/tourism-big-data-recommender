
services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      - POSTGRES_USER=${DB_USER}        
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # pgadmin:
  #   image: dpage/pgadmin4
  #   container_name: pgadmin_ui
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL} 
  #     PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD} 
  #   ports:
  #     - "5050:80"  # You will access it at http://localhost:8080
  #   depends_on:
  #     - postgres

  adminer:
    image: adminer
    container_name: adminer_ui
    restart: always
    ports:
      - "5050:8080"
    depends_on:
      - postgres

  neo4j:
    image: neo4j:5
    container_name: neo4j_db
    networks:
      default:
        aliases:
          - neo4j
          - neo4j_db
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data

  etl_worker:
    build: .
    container_name: etl_worker
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./config.yaml:/app/config.yaml
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
    tty: true
    stdin_open: true
    environment:
      - PYTHONUNBUFFERED=1
      - NEO4J_URI=bolt://neo4j:7687

volumes:
  pg_data:
  neo4j_data:


  
