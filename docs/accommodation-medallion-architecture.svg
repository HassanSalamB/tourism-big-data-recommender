<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Accommodation Intelligence Medallion Architecture</title>
  <desc id="desc">Hospitality source data flows through bronze, silver, and gold layers into analytics, APIs, and AI decision products, with orchestration, quality, lineage, and observability across the platform.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071520"/>
      <stop offset="0.52" stop-color="#0c2430"/>
      <stop offset="1" stop-color="#102c35"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8743c"/>
      <stop offset="1" stop-color="#714125"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dce7ec"/>
      <stop offset="1" stop-color="#8299a5"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd56a"/>
      <stop offset="1" stop-color="#c78d16"/>
    </linearGradient>
    <linearGradient id="product" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1fa985"/>
      <stop offset="1" stop-color="#0b6659"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#69cdb4"/>
    </marker>
    <style>
      .eyebrow { font: 700 18px Arial, sans-serif; letter-spacing: 3px; fill: #67d6ba; }
      .title { font: 700 44px Arial, sans-serif; fill: #f4faf8; }
      .subtitle { font: 400 19px Arial, sans-serif; fill: #aec1c7; }
      .section { font: 700 16px Arial, sans-serif; letter-spacing: 2px; fill: #8fa8af; }
      .card-title-dark { font: 700 25px Arial, sans-serif; fill: #fff; }
      .card-title-light { font: 700 25px Arial, sans-serif; fill: #15252c; }
      .card-sub-dark { font: 600 14px Arial, sans-serif; letter-spacing: 1.6px; fill: #dfeeea; }
      .card-sub-light { font: 600 14px Arial, sans-serif; letter-spacing: 1.6px; fill: #334b54; }
      .body-dark { font: 400 16px Arial, sans-serif; fill: #e8f3f0; }
      .body-light { font: 400 16px Arial, sans-serif; fill: #1c3038; }
      .source-title { font: 700 17px Arial, sans-serif; fill: #eaf4f2; }
      .source-sub { font: 400 14px Arial, sans-serif; fill: #9eb6bd; }
      .rail-title { font: 700 16px Arial, sans-serif; fill: #e8f5f1; }
      .rail-sub { font: 400 14px Arial, sans-serif; fill: #98b1b8; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="28" fill="url(#background)"/>
  <circle cx="1435" cy="90" r="230" fill="#123b43" opacity="0.38"/>
  <circle cx="1490" cy="45" r="135" fill="#1c6b62" opacity="0.18"/>

  <text x="70" y="70" class="eyebrow">ACCOMMODATION INTELLIGENCE LAB</text>
  <text x="70" y="125" class="title">Trusted hotel data before intelligent decisions</text>
  <text x="70" y="162" class="subtitle">A medallion architecture for resolving fragmented observations into governed facts and explainable commercial actions.</text>

  <rect x="1270" y="72" width="255" height="54" rx="27" fill="#133b3f" stroke="#4db99f" stroke-width="1.5"/>
  <circle cx="1304" cy="99" r="8" fill="#67d6ba"/>
  <text x="1323" y="105" class="source-title">Trust before AI</text>

  <text x="70" y="226" class="section">FRAGMENTED SOURCES</text>
  <text x="386" y="226" class="section">MEDALLION DATA PRODUCT</text>
  <text x="1302" y="226" class="section">DECISION PRODUCTS</text>

  <!-- Source systems -->
  <g filter="url(#shadow)">
    <rect x="70" y="258" width="250" height="78" rx="14" fill="#102d38" stroke="#31515b"/>
    <rect x="70" y="352" width="250" height="78" rx="14" fill="#102d38" stroke="#31515b"/>
    <rect x="70" y="446" width="250" height="78" rx="14" fill="#102d38" stroke="#31515b"/>
    <rect x="70" y="540" width="250" height="78" rx="14" fill="#102d38" stroke="#31515b"/>
  </g>
  <circle cx="105" cy="289" r="15" fill="#1e756c"/><text x="100" y="295" font-family="Arial" font-size="17" fill="#fff">P</text>
  <text x="134" y="288" class="source-title">Property providers</text><text x="134" y="312" class="source-sub">names · addresses · ratings</text>
  <circle cx="105" cy="383" r="15" fill="#1e756c"/><text x="100" y="389" font-family="Arial" font-size="17" fill="#fff">R</text>
  <text x="134" y="382" class="source-title">Rates &amp; inventory</text><text x="134" y="406" class="source-sub">price · availability · demand</text>
  <circle cx="105" cy="477" r="15" fill="#1e756c"/><text x="100" y="483" font-family="Arial" font-size="17" fill="#fff">E</text>
  <text x="134" y="476" class="source-title">Streaming events</text><text x="134" y="500" class="source-sub">Kafka · partner webhooks</text>
  <circle cx="105" cy="571" r="15" fill="#1e756c"/><text x="100" y="577" font-family="Arial" font-size="17" fill="#fff">X</text>
  <text x="134" y="570" class="source-title">External context</text><text x="134" y="594" class="source-sub">weather · POI · market signals</text>

  <!-- Flow arrows -->
  <path d="M320 438 C345 438 350 438 374 438" fill="none" stroke="#69cdb4" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M650 438 L688 438" fill="none" stroke="#69cdb4" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M964 438 L1002 438" fill="none" stroke="#69cdb4" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1278 438 L1316 438" fill="none" stroke="#69cdb4" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Bronze -->
  <g filter="url(#shadow)">
    <rect x="386" y="258" width="264" height="360" rx="22" fill="url(#bronze)"/>
  </g>
  <text x="414" y="301" class="card-sub-dark">BRONZE · RAW</text>
  <text x="414" y="340" class="card-title-dark">Preserve every signal</text>
  <line x1="414" y1="361" x2="622" y2="361" stroke="#e3b28a" opacity="0.65"/>
  <text x="414" y="400" class="body-dark">Immutable observations</text>
  <text x="414" y="431" class="body-dark">Source IDs + timestamps</text>
  <text x="414" y="462" class="body-dark">Schema &amp; content hashes</text>
  <text x="414" y="493" class="body-dark">Replayable event history</text>
  <rect x="414" y="536" width="208" height="52" rx="12" fill="#522f1d" opacity="0.72"/>
  <text x="430" y="558" class="source-title">Object storage · JSONB</text>
  <text x="430" y="579" class="source-sub" fill="#efd2bc">Kafka landing topics</text>

  <!-- Silver -->
  <g filter="url(#shadow)">
    <rect x="700" y="258" width="264" height="360" rx="22" fill="url(#silver)"/>
  </g>
  <text x="728" y="301" class="card-sub-light">SILVER · TRUSTED</text>
  <text x="728" y="340" class="card-title-light">Resolve &amp; validate</text>
  <line x1="728" y1="361" x2="936" y2="361" stroke="#4e6872" opacity="0.55"/>
  <text x="728" y="400" class="body-light">Normalize names &amp; addresses</text>
  <text x="728" y="431" class="body-light">Geo candidate generation</text>
  <text x="728" y="462" class="body-light">Entity match evidence</text>
  <text x="728" y="493" class="body-light">Quality + freshness checks</text>
  <rect x="728" y="536" width="208" height="52" rx="12" fill="#6f8791" opacity="0.68"/>
  <text x="744" y="558" class="source-title">Spark · Python · dbt</text>
  <text x="744" y="579" class="source-sub" fill="#e8f2f5">Postgres · Parquet</text>

  <!-- Gold -->
  <g filter="url(#shadow)">
    <rect x="1014" y="258" width="264" height="360" rx="22" fill="url(#gold)"/>
  </g>
  <text x="1042" y="301" class="card-sub-light">GOLD · BUSINESS-READY</text>
  <text x="1042" y="340" class="card-title-light">Publish trusted facts</text>
  <line x1="1042" y1="361" x2="1250" y2="361" stroke="#765715" opacity="0.48"/>
  <text x="1042" y="400" class="body-light">Canonical properties</text>
  <text x="1042" y="431" class="body-light">Rate parity + demand</text>
  <text x="1042" y="462" class="body-light">Availability features</text>
  <text x="1042" y="493" class="body-light">Semantic marts + graph</text>
  <rect x="1042" y="536" width="208" height="52" rx="12" fill="#a87514" opacity="0.7"/>
  <text x="1058" y="558" class="source-title">dbt marts · Postgres</text>
  <text x="1058" y="579" class="source-sub" fill="#fff0bf">Neo4j · feature tables</text>

  <!-- Decision products -->
  <g filter="url(#shadow)">
    <rect x="1328" y="258" width="202" height="360" rx="22" fill="url(#product)"/>
  </g>
  <text x="1354" y="301" class="card-sub-dark">SERVE · ACT</text>
  <text x="1354" y="340" class="card-title-dark">Make decisions</text>
  <line x1="1354" y1="361" x2="1504" y2="361" stroke="#8ce1cd" opacity="0.6"/>
  <text x="1354" y="400" class="body-dark">Revenue analytics</text>
  <text x="1354" y="431" class="body-dark">Hotel-facing APIs</text>
  <text x="1354" y="462" class="body-dark">Forecasting models</text>
  <text x="1354" y="493" class="body-dark">Explainable AI actions</text>
  <rect x="1354" y="536" width="150" height="52" rx="12" fill="#084d45" opacity="0.82"/>
  <text x="1370" y="558" class="source-title">FastAPI</text>
  <text x="1370" y="579" class="source-sub" fill="#d8f5ed">Streamlit · BI</text>

  <!-- Cross-cutting control plane -->
  <rect x="70" y="674" width="1460" height="148" rx="22" fill="#0b1f29" stroke="#284852" stroke-width="1.5"/>
  <text x="98" y="711" class="section">PLATFORM CONTROL PLANE</text>
  <line x1="98" y1="731" x2="1502" y2="731" stroke="#294953"/>

  <circle cx="125" cy="770" r="22" fill="#163b45"/><text x="118" y="777" font-family="Arial" font-size="20" fill="#70d7bf">↻</text>
  <text x="162" y="765" class="rail-title">Airflow orchestration</text><text x="162" y="789" class="rail-sub">schedules · retries · backfills</text>

  <circle cx="468" cy="770" r="22" fill="#163b45"/><text x="461" y="777" font-family="Arial" font-size="19" fill="#70d7bf">✓</text>
  <text x="505" y="765" class="rail-title">Quality &amp; contracts</text><text x="505" y="789" class="rail-sub">dbt tests · freshness SLOs</text>

  <circle cx="812" cy="770" r="22" fill="#163b45"/><text x="805" y="777" font-family="Arial" font-size="19" fill="#70d7bf">⌁</text>
  <text x="849" y="765" class="rail-title">Lineage &amp; governance</text><text x="849" y="789" class="rail-sub">ownership · provenance · audit</text>

  <circle cx="1170" cy="770" r="22" fill="#163b45"/><text x="1163" y="777" font-family="Arial" font-size="19" fill="#70d7bf">◎</text>
  <text x="1207" y="765" class="rail-title">Observability</text><text x="1207" y="789" class="rail-sub">Prometheus · Grafana · alerts</text>

  <text x="70" y="862" class="subtitle">Design principle: identity, lineage, and quality are measurable before any recommendation reaches a hotel operator.</text>
</svg>
